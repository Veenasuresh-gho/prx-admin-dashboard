<div class="tenant-container">
    <div *ngIf="loading">

        <!-- Cover -->
        <div class="cover skeleton"></div>

        <!-- Header -->
        <div class="header">
            <div class="logo skeleton"></div>

            <div class="info">
                <div class="skeleton text-lg"></div>
                <div class="skeleton text-sm"></div>
                <div class="skeleton text-xs"></div>
            </div>
        </div>

        <!-- About -->
        <div class="section">
            <div class="skeleton text-lg"></div>
            <div class="skeleton text"></div>
            <div class="skeleton text"></div>
        </div>

        <div class="section grid">
            <div class="skeleton box"></div>
            <div class="skeleton box"></div>
            <div class="skeleton box"></div>
        </div>

    </div>
    <div class="cover">
        <img [src]="details?.CoverImage || 'icons/nophoto.svg'" [alt]="details?.TenantName">
    </div>

    <div class="p10 x-noscroll" *ngIf="details">

        <!-- Header Edit Section -->
        <div class="d-flex justify-content-between align-items-center mb-3">

            <div class="tenentImg">
                <img class="logo" [src]="details['Logo'] || 'icons/nophoto.svg'">
            </div>

            <div class="flex-grow-1 ms-3 pt-4">

                <mat-form-field class="w100" [appearance]="fieldStyle">
                    <mat-label>Tenant Name</mat-label>
                    <input matInput [(ngModel)]="details['TenantName']">
                </mat-form-field>

                <mat-form-field class="w100" appearance="outline">
                    <mat-label>Type</mat-label>


                    <mat-select [(ngModel)]="details['Type']">
                        <mat-option *ngFor="let t of tenantTypes" [value]="t.ID">
                            {{ t.Tenant }}
                        </mat-option>
                    </mat-select>

                </mat-form-field>


            </div>
        </div>

        <!-- About -->
        <mat-form-field class="w100" [appearance]="fieldStyle">
            <mat-label>About</mat-label>
            <textarea matInput rows="3" [(ngModel)]="details['About']"></textarea>
        </mat-form-field>

        <div class="row">

            <div class="col-12 col-lg-8">
                <mat-form-field class="w100" [appearance]="fieldStyle">
                    <mat-label>Email</mat-label>
                    <input matInput [(ngModel)]="details['Email']">
                </mat-form-field>
            </div>

            <div class="col-12 col-lg-4 d-flex gap-2">

                <mat-form-field style="width:40%" [appearance]="fieldStyle">
                    <mat-label>Country Code</mat-label>

                    <mat-select [(ngModel)]="details['CountryID']">

                        <mat-select-trigger>
                            +{{ getSelectedCountryCode() }}
                        </mat-select-trigger>

                        <mat-option *ngFor="let c of cntrys" [value]="c.CountryID">
                            +{{ c.CountryCode }} {{ c.CountryName }}
                        </mat-option>

                    </mat-select>

                </mat-form-field>

                <mat-form-field style="width:60%" [appearance]="fieldStyle">
                    <mat-label>Phone</mat-label>
                    <input matInput [(ngModel)]="details['Phone']">
                </mat-form-field>

            </div>

            <div class="col-12 ">
                <mat-form-field class="w100" [appearance]="fieldStyle">
                    <mat-label>Website</mat-label>
                    <input matInput [(ngModel)]="details['WebsiteLink']">
                </mat-form-field>
            </div>

        </div>

        <!-- Location -->
        <mat-form-field class="w100" [appearance]="fieldStyle">
            <mat-label>Address</mat-label>
            <input matInput [(ngModel)]="details['Address']">
        </mat-form-field>

        <mat-form-field class="w100" [appearance]="fieldStyle">
            <mat-label>Location</mat-label>
            <input matInput [(ngModel)]="details['Location']">
        </mat-form-field>

        <!-- Button -->
        <div class="d-flex justify-content-end p-2 gap-3">
            <button class="btn btn-danger px-4 fw-semibold" (click)="deleteTenant()">
                Delete
            </button>
            <button class="btn btn-primary px-4 fw-semibold" (click)="updateTenant()">
                Update
            </button>
        </div>

    </div>
    <div class="p10 x-noscroll">
        <p class="tenantUser">Tenant Users</p>

        <app-tenant-user-list 
  [tenant]="tenant"
  (usersLoaded)="onUsersLoaded($event)">
</app-tenant-user-list>
    </div>

</div>
