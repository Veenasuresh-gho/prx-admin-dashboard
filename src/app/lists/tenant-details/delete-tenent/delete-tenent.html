<h2 mat-dialog-title >
 <span class="text-[#1E5A7C] font-sans px-1"> Confirm Delete</span>
</h2>

<mat-dialog-content class="text-gray-600 px-3 py-2">
  Are you sure you want to Delete?
</mat-dialog-content>
<div>
    
</div>
<mat-dialog-actions align="end" class="mt-4">
  <button mat-button mat-dialog-close (click)="close()"
          class="px-4 py-2 rounded-lg hover:bg-gray-200">
    No
  </button>

  <button mat-button  [mat-dialog-close]="true"
          class="px-4 py-2 rounded-lg  ">
    Yes
  </button>
</mat-dialog-actions>
