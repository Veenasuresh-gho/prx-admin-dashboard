<div class="main">
  <div class="section">
    <p class="section-title">Overview</p>
    <span class="section-title">
      {{ currentDate | date:'EEE, dd MMM, yyyy' }}
    </span>
  </div>

  <div class="cards">
    <div class="card" *ngFor="let card of cards" [ngClass]="card.color" (click)="openTenant(card)">

      <div class="card-header">
        <div class="card-icon">
          <mat-icon>{{ card.icon }}</mat-icon>
        </div>
      </div>

      <div class="card-count">
        {{ card.count }}
      </div>


      <div class="card-label">
        {{ card.label }}
      </div>

    </div>
  </div>

  <div class="card login-card" (click)="goToLoginDetails()">
    <div class="card-header-row">
      <div class="header-left">
        <mat-icon>login</mat-icon>
        <span class="card-label">Today's Login Count</span>
      </div>
      <span class="total-count">{{ loginStats.total }}</span>
    </div>

    <div class="platform-grid">
      <div class="platform-item" *ngFor="let p of platforms">
        <div class="platform-name">
          <mat-icon>{{ p.icon }}</mat-icon>
          {{ p.label }}
        </div>
        <div class="platform-count">{{ p.count }}</div>
        <div class="progress-track">
          <div class="progress-fill" [style.width.%]="getPercent(p.count)" [style.background]="p.color"></div>
        </div>
        <div class="platform-pct">{{ getPercent(p.count) }}% of total</div>
      </div>
    </div>
  </div>


</div>
