<div class="row">
    <div class="col-sm-12 bg-white">
        <div class="border-round bg-white p10 border">
            <h5>Contact Second Opinion Newtwork</h5>
            <div>
                <mat-form-field class="w100 pt20" appearance="outline">
                    <mat-label>Provide comments or suggestions </mat-label>
                    <textarea matInput type="text" [rows]=10 [(ngModel)]="msg"> </textarea>
                </mat-form-field>

                <div class=" col-sm-12 "> <button class="" (click)="send()" matButton="filled">Send your comments
                    </button></div>
            </div>
        </div>
    </div>


</div>
